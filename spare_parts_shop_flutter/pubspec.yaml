name: stock_pilot
description: "Stock Pilot - Multi-Tenant Inventory & Billing Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  url_launcher: ^6.3.1
  fl_chart: ^0.69.0
  font_awesome_flutter: ^10.8.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  printing: ^5.14.2
  pdf: ^3.11.3
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  web_socket_channel: ^3.0.2
  provider: ^6.1.2

  # Added
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  dio: ^5.7.0
  go_router: ^14.6.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.4
  equatable: ^2.0.7
  shimmer_animation: ^2.2.1
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  mobile_scanner: ^7.2.0
  blue_thermal_printer: ^1.2.3
  local_auth: ^3.0.1
  sqflite: ^2.4.2+1
  connectivity_plus: ^7.2.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  jwt_decoder: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/stockpilot_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/stockpilot_logo.png"
    background_color: "#2563EB"
    theme_color: "#2563EB"
  windows:
    generate: true
    image_path: "assets/stockpilot_logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/stockpilot_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
